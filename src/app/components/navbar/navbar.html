<nav [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="nav-inner">
    <span class="logo" (click)="scrollTo('home')">Flavio Poli</span>
    <div class="nav-right">
      <!-- Link desktop -->
      <ul class="nav-links">
        <li><button (click)="scrollTo('about')">About</button></li>
        <li><button (click)="scrollTo('skills')">Skills</button></li>
        <li><button (click)="scrollTo('experience')">Esperienza</button></li>
        <li><button (click)="scrollTo('contact')" class="cta-nav">Contattami</button></li>
      </ul>
      <!-- Toggle tema (sempre visibile) -->
      <button
        class="theme-toggle"
        (click)="theme.toggle()"
        [title]="theme.isDark() ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
      >
        <span class="icon-sun">☀</span>
        <span class="icon-moon">☾</span>
        <span class="toggle-thumb" [class.light]="!theme.isDark()"></span>
      </button>
      <!-- Hamburger (solo mobile) -->
      <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Menu mobile -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul>
      <li><button (click)="scrollTo('about')">About</button></li>
      <li><button (click)="scrollTo('skills')">Skills</button></li>
      <li><button (click)="scrollTo('experience')">Esperienza</button></li>
      <li><button (click)="scrollTo('contact')" class="cta-mobile">Contattami</button></li>
    </ul>
  </div>
</nav>
