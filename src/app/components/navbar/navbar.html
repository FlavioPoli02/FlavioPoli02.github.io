<div class="progress" aria-hidden="true" [style.transform]="'scaleX(' + progress + ')'"></div>
<header [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="pill">
    <a class="logo" href="#home" (click)="closeMenu()" [attr.aria-label]="name + ' — inizio pagina'">
      <span class="mark" aria-hidden="true">FP</span><span class="nm">{{ name }}</span>
    </a>

    <nav aria-label="Principale" class="links" id="site-menu" [class.open]="menuOpen">
      <ul>
        @for (item of nav; track item.id) {
          <li><a [href]="'#' + item.id" [attr.aria-current]="active === item.id ? 'location' : null" (click)="closeMenu()">{{ item.label }}</a></li>
        }
        <li><a href="#contact" class="cta" [attr.aria-current]="active === 'contact' ? 'location' : null" (click)="closeMenu()">Contatti</a></li>
      </ul>
    </nav>

    <button type="button" class="switch" role="switch" aria-label="Tema scuro"
      [attr.aria-checked]="theme.isDark()" (click)="theme.toggle()">
      <span class="lbl" aria-hidden="true">{{ theme.isDark() ? 'Scuro' : 'Chiaro' }}</span>
      <span class="track" aria-hidden="true">
        <span class="thumb">
          @if (theme.isDark()) {
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          }
        </span>
      </span>
    </button>

    <button type="button" class="menu-btn" (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen" aria-controls="site-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        @if (menuOpen) { <path d="M6 6l12 12M18 6L6 18"/> } @else { <path d="M4 8h16M4 16h16"/> }
      </svg>
    </button>
  </div>
</header>
